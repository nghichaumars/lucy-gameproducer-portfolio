<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pack &amp; Groove Travel – Playable Ad Prototype</title>
<!--
  PACK & GROOVE · TRAVEL EDITION: suitcase-packing playable ad prototype (from the Pack & Groove concept doc)
  Format: single self-contained HTML, no external requests (ad-network ready).
  Flow: Hook "Can you fit it ALL in the suitcase?" -> Trip 1 guided (drag, then tap-to-rotate)
        -> zip, tag & take-off payoff -> Trip 5 with a boarding countdown -> Win / Flight missed -> End card + CTA
  Art: every visual can be replaced through the ASSET SLOTS block in the script.
  Concept test (doc §6): does a per-order countdown (Variant B) create urgency without hurting completion?
        Default = countdown on. Add ?timer=off to the URL for the no-timer (Zen) variant.
  Analytics: events are posted to the parent window ({source:'playable', game, event, t}).
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#5EC4FF;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .btn{border:0;cursor:pointer;font:inherit;font-weight:900;color:#fff;letter-spacing:.5px}
  #dl{position:absolute;top:10px;right:10px;padding:8px 14px;border-radius:999px;font-size:13px;
    background:linear-gradient(#ffd84a,#ffb300);color:#4a2400;box-shadow:0 3px 0 #b87700}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(31,58,104,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .overlay.show{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:min(84vw,340px);text-align:center;color:#fff;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .icon{width:100px;height:100px;margin:0 auto 14px;border-radius:24px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#9be0ff,#3a9ee8);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .icon .case{position:absolute;left:21px;top:38px;width:58px;height:46px;border-radius:10px;background:#ff7a3d;border:3px solid #2b1d14;box-shadow:inset 0 -6px 0 #d9581f}
  .icon .case::before{content:"";position:absolute;left:14px;top:-15px;width:24px;height:10px;border:4px solid #2b1d14;border-bottom:0;border-radius:6px 6px 0 0}
  .icon .case::after{content:"";position:absolute;left:0;top:17px;width:100%;height:6px;background:#ffd23f}
  .icon .cloud{position:absolute;left:52px;top:12px;width:34px;height:14px;border-radius:10px;background:#fff}
  h1{margin:0;font-size:30px;color:#ffd700}
  .tag{margin:6px 0 10px;opacity:.9;font-size:15px}
  .stars{color:#ffd700;font-size:18px;margin-bottom:22px}
  .stars span{color:#fff;font-size:14px;opacity:.8;margin-left:6px}
  .play{width:100%;padding:18px;border-radius:18px;font-size:24px;
    background:linear-gradient(#6ee7de,#4ecdc4);color:#0f3b38;box-shadow:0 6px 0 #2a9c94;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .ghost{margin-top:14px;background:none;opacity:.75;font-size:15px}
  .msg{font-size:32px;margin-bottom:6px;color:#ffd700}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="fail" class="overlay"><div class="card">
  <div class="msg">Flight missed!</div><div class="tag" id="failTxt">So close… can you do better?</div>
  <button class="btn play" id="retry">TRY AGAIN</button>
</div></div>

<div id="end" class="overlay"><div class="card">
  <div class="icon"><div class="cloud"></div><div class="case"></div></div>
  <h1>Pack &amp; Groove</h1>
  <div class="tag">Pack it perfectly. Travel the world.</div>
  <div class="stars">★★★★★<span>18 trips · 1 impossible suitcase</span></div>
  <button class="btn play" id="replay">↻ PLAY AGAIN</button>
</div></div>

<script>
(()=>{
/* ---------- ad plumbing ---------- */
const GAME='pack-and-groove-travel';
const STORE_URL='https://play.google.com/store/apps';
const TIMER_ON=(()=>{try{return new URLSearchParams(location.search).get('timer')!=='off'}catch(e){return true}})();

/* ===================== ASSET SLOTS: swap in your own art =====================
  Each slot is null (use the built-in drawing) or an image URL / data URI.
  For ad networks, keep it one offline file: embed images as data URIs
  ("data:image/png;base64,..."). You can also define window.PG_ASSETS before this script.
  Transparent PNGs at ~100 px per grid cell:
    pieces.*     the item in its START orientation (as it first appears on the belt),
                 sized to its footprint. The game rotates it for you.
                 lunch 300x200 · cal 200x200 · snake 400x100 · bottle 200x100
                 shoe 200x200 · bino 300x100 · plus 300x300 · crown 300x200
    suitcase     open suitcase frame drawn behind the grid. Its inner area should
                 match the grid: (cols*100 + 44) x (rows*100 + 44)
    suitcaseLid  closed lid, same size as suitcase
    mascot       square character, 256x256
    background   portrait scene, 1080x1920 (the belt covers the bottom 30%)
    plane        side view facing right, 400x160
    endcardIcon  app icon, 512x512
============================================================================== */
const ASSETS=Object.assign({
  pieces:{lunch:null,cal:null,snake:null,bottle:null,shoe:null,bino:null,plus:null,crown:null},
  suitcase:null,suitcaseLid:null,mascot:null,background:null,plane:null,endcardIcon:null,
},window.PG_ASSETS||{});
const IMG={};
function loadImg(key,src){if(!src)return;const im=new Image();im.onload=()=>{IMG[key]=im};im.src=src}
for(const k in (ASSETS.pieces||{}))loadImg('piece_'+k,ASSETS.pieces[k]);
['suitcase','suitcaseLid','mascot','background','plane'].forEach(k=>loadImg(k,ASSETS[k]));
if(ASSETS.endcardIcon){const ic=document.querySelector('#end .icon');ic.innerHTML='';ic.style.background='none';
  const im=new Image();im.src=ASSETS.endcardIcon;im.style.cssText='width:100%;height:100%;object-fit:cover';ic.appendChild(im)}
const T0=performance.now();
function track(event,data){
  const msg={source:'playable',game:GAME,event,t:+((performance.now()-T0)/1000).toFixed(2),...(data||{})};
  try{parent.postMessage(msg,'*')}catch(e){}
}
function openStore(where){
  track('cta_click',{where});
  try{ if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;} }catch(e){}
  try{ if(window.FbPlayableAd){FbPlayableAd.onCTAClick();return;} }catch(e){}
  window.open(STORE_URL,'_blank');
}

/* ---------- canvas / scaling ---------- */
const W=540,H=960;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1,sc=1,ox=0,oy=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2;
}
addEventListener('resize',resize);resize();
const toWorld=e=>({x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc});
const now=()=>performance.now()/1000;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOutBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const FONT=w=>`900 ${w}px "Arial Rounded MT Bold",Nunito,system-ui,sans-serif`;

/* ---------- audio (synthesised, unlocked on first touch) ---------- */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,vol,f2,delay){
  if(!AC)return;try{
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const SFX={
  snap(){tone(520,.07,'triangle',.18,900);tone(1200,.05,'sine',.08,null,.04);buzz(12)},
  pick(){tone(380,.06,'sine',.1,520)},
  rot(){tone(900,.05,'square',.04,700)},
  bad(){tone(170,.18,'square',.06,110);buzz([20,40,20])},
  thunk(){tone(150,.3,'sine',.35,55);buzz(30)},
  zip(){for(let i=0;i<16;i++)tone(1500+i*40,.025,'square',.03,null,i*.04);[880,1320].forEach((f,i)=>tone(f,.15,'triangle',.08,null,.7+i*.08))},
  jet(){tone(90,1.1,'sawtooth',.05,240)},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.12,null,i*.09))},
};

/* ---------- souvenirs (from the concept doc piece set) ---------- */
const SHAPES={
  lunch:{name:'Lunchbox',cells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],col:'#00A8FF'},
  cal:{name:'Calendar',cells:[[0,0],[1,0],[0,1],[1,1]],col:'#FFB300'},
  snake:{name:'Snake',cells:[[0,0],[1,0],[2,0],[3,0]],col:'#5CC46A'},
  bottle:{name:'Bottle',cells:[[0,0],[1,0]],col:'#FF2A85'},
  shoe:{name:'Shoe',cells:[[0,0],[0,1],[1,1]],col:'#FF3D00'},
  bino:{name:'Binocular',cells:[[0,0],[1,0],[2,0]],col:'#5CC46A'},
  plus:{name:'Pinwheel',cells:[[1,0],[0,1],[1,1],[2,1],[1,2]],col:'#FF2A85'},
  crown:{name:'Crown',cells:[[0,0],[2,0],[0,1],[1,1],[2,1]],col:'#9C27B0'},
};
function norm(c){const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(p=>[p[0]-mx,p[1]-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0])}
function rotCells(c,r){let o=c.map(p=>p.slice());for(let i=0;i<r;i++)o=o.map(([x,y])=>[-y,x]);return norm(o)}
const keyOf=c=>c.map(p=>p.join(',')).join(';');
const bboxOf=c=>({w:Math.max(...c.map(p=>p[0]))+1,h:Math.max(...c.map(p=>p[1]))+1});

/* ---------- orders (both verified solvable; Order 5 has one solution up to symmetry) ---------- */
const LEVELS=[
  {order:1,place:'Beach Town',w:4,h:4,timer:0,pieces:[['lunch',0],['snake',0],['cal',0],['bottle',0]]},
  {order:5,place:'Night Market',w:5,h:4,timer:30,pieces:[['crown',0],['plus',0],['shoe',0],['bino',0],['cal',0]]},
];
const BOX_TOP=300,LIFT=78,TC=38;

let L,lvl,C,boxX,pieces,state,stateT,fails=0,firstTouch=false,adStart,lastInput,placeSeq=0,
    timeLeft=0,ver=0,down=null,drag=null,fx=[],texts=[],stars=0,rotLearned=false,tutDone=false,hintLogged=-1,
    mascot={text:'',until:0,mood:0,bounce:0};

function startLevel(i){
  lvl=i;L=LEVELS[i];C=Math.min(84,Math.floor(440/L.w));boxX=(W-L.w*C)/2;
  solCache.clear();
  pieces=L.pieces.map(([k,r],j)=>({k,id:j,rot:r,placed:null,seq:0,spin:0,shake:0,disp:null}));
  layoutTray();pieces.forEach(p=>{const tg=target(p);p.disp={x:tg.x,y:tg.y+(i?260:0),s:tg.s}});
  state=i===0?'play':'intro';stateT=now();lastInput=now();ver++;hintLogged=-1;
  timeLeft=L.timer;down=drag=null;
  if(i===0)say('Let\'s pack for '+L.place+'!',2.6);
  else say(TIMER_ON?'Flight boards in '+L.timer+' seconds!':'Take your time, no rush!',2.6);
}
function fullReset(){fails=0;stars=0;adStart=now();fx=[];texts=[];startLevel(0)}

/* ---------- geometry ---------- */
const cellsOf=p=>rotCells(SHAPES[p.k].cells,p.rot);
function layoutTray(){
  const n=pieces.length,cols=n<=3?n:Math.ceil(n/2),rows=n<=3?1:2;
  pieces.forEach((p,i)=>{
    const row=rows===1?0:(i<cols?0:1),inRow=rows===1?n:(row===0?cols:n-cols),j=row===0?i:i-cols;
    p.slot={x:W/2+(j-(inRow-1)/2)*(510/cols),y:rows===1?820:756+row*128};
  });
}
function target(p){
  const c=cellsOf(p),b=bboxOf(c);
  if(drag&&drag.p===p)return{x:drag.x-b.w*C/2,y:drag.y-b.h*C/2-LIFT,s:C};
  if(p.placed)return{x:boxX+p.placed.x*C,y:BOX_TOP+p.placed.y*C,s:C};
  return{x:p.slot.x-b.w*TC/2,y:p.slot.y-b.h*TC/2,s:TC};
}
function gridOf(except){
  const g=new Array(L.w*L.h).fill(-1);
  for(const p of pieces)if(p.placed&&p!==except)for(const [x,y] of cellsOf(p))g[(p.placed.y+y)*L.w+p.placed.x+x]=p.id;
  return g;
}
function fits(p,cells,gx,gy,g){
  for(const [x,y] of cells){const X=gx+x,Y=gy+y;if(X<0||Y<0||X>=L.w||Y>=L.h||g[Y*L.w+X]!==-1)return false}
  return true;
}
function snapOf(p){ // where the dragged piece would land
  const c=cellsOf(p),b=bboxOf(c),ox=drag.x-b.w*C/2,oy=drag.y-b.h*C/2-LIFT;
  const gx=Math.round((ox-boxX)/C),gy=Math.round((oy-BOX_TOP)/C);
  const cx=ox+b.w*C/2,cy=oy+b.h*C/2;
  const over=cx>boxX-C*.6&&cx<boxX+L.w*C+C*.6&&cy>BOX_TOP-C*.6&&cy<BOX_TOP+L.h*C+C*.6;
  return{gx,gy,over,ok:over&&fits(p,c,gx,gy,gridOf(p))};
}

/* ---------- solver: powers hints (never wrong) ---------- */
const solCache=new Map();
function solve(){
  const key=pieces.map(p=>p.placed?p.placed.x+','+p.placed.y+','+keyOf(cellsOf(p)):'-').join('|');
  if(solCache.has(key))return solCache.get(key);
  const g=gridOf(null),rem=pieces.filter(p=>!p.placed);
  const ors=rem.map(p=>{const seen=new Set(),o=[];for(let r=0;r<4;r++){const c=rotCells(SHAPES[p.k].cells,r),k=keyOf(c);if(!seen.has(k)){seen.add(k);o.push({r,c})}}return o});
  const used=new Array(rem.length).fill(false);
  function rec(){
    const e=g.indexOf(-1);if(e<0)return[];
    const ex=e%L.w,ey=(e/L.w)|0;
    for(let i=0;i<rem.length;i++){if(used[i])continue;
      for(const o of ors[i]){
        const a=o.c[0],gx=ex-a[0],gy=ey-a[1];
        if(!fits(rem[i],o.c,gx,gy,g))continue;
        for(const [x,y] of o.c)g[(gy+y)*L.w+gx+x]=rem[i].id;used[i]=true;
        const r=rec();
        for(const [x,y] of o.c)g[(gy+y)*L.w+gx+x]=-1;used[i]=false;
        if(r)return[{p:rem[i],c:o.c,x:gx,y:gy}].concat(r);
      }}
    return null;
  }
  const res=rec();solCache.set(key,res);return res;
}
function currentHint(){
  const s=solve();
  if(!s){ // dead end: suggest taking out the most recent piece
    let lastP=null;for(const p of pieces)if(p.placed&&(!lastP||p.seq>lastP.seq))lastP=p;
    return lastP?{type:'remove',p:lastP}:null;
  }
  if(!s.length)return null;
  const st=s[0];
  if(keyOf(cellsOf(st.p))!==keyOf(st.c))return{type:'rotate',p:st.p};
  return{type:'drag',p:st.p,x:st.x,y:st.y};
}

/* ---------- mascot ---------- */
function say(text,dur,mood){mascot.text=text;mascot.until=now()+(dur||2);mascot.mood=mood||0;mascot.bounce=now()}

/* ---------- input ---------- */
function pieceAt(q){
  // box first
  const gx=Math.floor((q.x-boxX)/C),gy=Math.floor((q.y-BOX_TOP)/C);
  if(gx>=0&&gy>=0&&gx<L.w&&gy<L.h){const id=gridOf(null)[gy*L.w+gx];if(id>=0)return{p:pieces[id],from:'box'}}
  let best=null,bd=1e9;
  for(const p of pieces){if(p.placed)continue;const d=p.disp,b=bboxOf(cellsOf(p));
    const cx=d.x+b.w*d.s/2,cy=d.y+b.h*d.s/2,hw=b.w*d.s/2+22,hh=b.h*d.s/2+22;
    if(Math.abs(q.x-cx)<hw&&Math.abs(q.y-cy)<hh){const dd=Math.hypot(q.x-cx,q.y-cy);if(dd<bd){bd=dd;best=p}}}
  return best?{p:best,from:'tray'}:null;
}
cv.addEventListener('pointerdown',e=>{
  unlockAudio();
  if(state!=='play')return;
  const q=toWorld(e);lastInput=now();
  if(!firstTouch){firstTouch=true;track('first_interaction')}
  const h=pieceAt(q);if(!h)return;
  down={...h,x0:q.x,y0:q.y,t0:now()};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!down||state!=='play')return;
  const q=toWorld(e);lastInput=now();
  if(!drag&&Math.hypot(q.x-down.x0,q.y-down.y0)>10){
    drag={p:down.p,from:down.from,x:q.x,y:q.y};
    if(down.p.placed){down.p.placed=null;ver++}
    SFX.pick();
  }
  if(drag){drag.x=q.x;drag.y=q.y}
});
cv.addEventListener('pointerup',e=>{
  if(!down)return;lastInput=now();
  if(state!=='play'){down=drag=null;return}
  if(drag)drop();else tap(down);
  down=null;
});
cv.addEventListener('pointercancel',()=>{if(drag){drag=null;ver++}down=null});

function drop(){
  const p=drag.p,s=snapOf(p);
  if(s.ok){
    p.placed={x:s.gx,y:s.gy};p.seq=++placeSeq;SFX.snap();
    pop(p);track('piece_placed',{order:L.order,piece:SHAPES[p.k].name});
    if(!tutDone&&lvl===0){tutDone=true;track('tutorial_complete')}
    const filled=gridOf(null).filter(v=>v>=0).length,total=L.w*L.h;
    if(filled===total){drag=null;ver++;win();return}
    if(filled/total>.6&&Math.random()<.6)say(['Nice fit!','Snug!','Travel pro!'][placeSeq%3],1.4,1);
  }else if(s.over){
    SFX.bad();p.shake=.35;say('Hmm, that won\'t fit…',1.4,2);
  }
  drag=null;ver++;
}
function tap(d){
  const p=d.p;
  if(d.from==='tray'){p.rot=(p.rot+1)%4;p.spin=-Math.PI/2;SFX.rot();noteRotate();ver++;return}
  // rotate in place, nudging up to 2 cells (doc §2)
  const old=cellsOf(p),ob=bboxOf(old),nr=(p.rot+1)%4,nc=rotCells(SHAPES[p.k].cells,nr),nb=bboxOf(nc);
  const g=gridOf(p),bx=p.placed.x+Math.floor((ob.w-nb.w)/2),by=p.placed.y+Math.floor((ob.h-nb.h)/2);
  const offs=[];for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)offs.push([dx,dy]);
  offs.sort((a,b)=>Math.abs(a[0])+Math.abs(a[1])-Math.abs(b[0])-Math.abs(b[1]));
  for(const [dx,dy] of offs)if(fits(p,nc,bx+dx,by+dy,g)){p.rot=nr;p.placed={x:bx+dx,y:by+dy};p.spin=-Math.PI/2;SFX.rot();noteRotate();ver++;return}
  p.shake=.3;SFX.bad();
}
function noteRotate(){if(!rotLearned){rotLearned=true;track('rotate_learned')}}

/* ---------- flow ---------- */
let packT=0;
function win(){
  state='packed';packT=now();stars++;SFX.win();
  track('level_win',{order:L.order,time_left:L.timer&&TIMER_ON?Math.ceil(timeLeft):null});
  confetti(W/2,BOX_TOP+L.h*C/2,140);say('PERFECT PACK!',2.2,1);
}
function lose(){
  if(state!=='play')return;state='lost';fails++;drag=null;down=null;
  const left=gridOf(null).filter(v=>v<0).length;
  track('level_fail',{order:L.order,cells_left:left});SFX.bad();say('Oh no, the plane left!',2,2);
  document.getElementById('failTxt').textContent=left<=5?`Only ${left} cell${left>1?'s':''} left… can you do better?`:'So close… can you do better?';
  setTimeout(()=>{if(state!=='lost')return;if(fails>=2)showEnd();else document.getElementById('fail').classList.add('show')},900);
}
function showEnd(){
  if(state==='end')return;state='end';
  document.getElementById('fail').classList.remove('show');
  document.getElementById('end').classList.add('show');track('endcard_show');
}

/* ---------- fx ---------- */
function confetti(x,y,n){const cols=['#FFD700','#FF2A85','#00A8FF','#4ECDC4','#FF3D00','#fff'];
  for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*800,vy:-Math.random()*800-150,r:4+Math.random()*4,c:cols[i%6],life:1.9,rot:Math.random()*6,g:1300})}
function pop(p){
  const b=bboxOf(cellsOf(p)),cx=boxX+(p.placed.x+b.w/2)*C,cy=BOX_TOP+(p.placed.y+b.h/2)*C;
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;fx.push({x:cx,y:cy,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:3,c:'#fff',life:.45,g:0,star:true})}
  texts.push({s:'+10',x:cx,y:cy-20,life:.9,c:'#fff'});
}

/* ---------- drawing helpers ---------- */

  const k=ease(lid),sy=-1+2*k; // flips over the top hinge
  // handle
  ctx.save();ctx.lineCap='round';ctx.strokeStyle='#2b1d14';ctx.lineWidth=15;
  if(sy>0){ctx.beginPath();ctx.moveTo(cx-46,Y+4);ctx.lineTo(cx-46,Y-24);ctx.lineTo(cx+46,Y-24);ctx.lineTo(cx+46,Y+4);ctx.stroke();
    ctx.strokeStyle='#4A505B';ctx.lineWidth=8;ctx.stroke()}
  ctx.restore();
  ctx.save();ctx.translate(0,Y);ctx.scale(1,Math.abs(sy)<.02?.02*Math.sign(sy||1):sy);ctx.translate(0,-Y);
  if(sy<0){ // inside of the lid while it swings
    ctx.fillStyle=CASE;rr(X,Y,Wd,Hd,26);ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle=LINING;rr(X+16,Y+16,Wd-32,Hd-32,14);ctx.fill();
  }else if(IMG.suitcaseLid){ctx.drawImage(IMG.suitcaseLid,X,Y,Wd,Hd)}
  else{
    ctx.fillStyle=CASE;rr(X,Y,Wd,Hd,26);ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=5;ctx.stroke();
    // hard-shell ridges
    for(let i=1;i<5;i++){const rx=X+Wd*i/5;ctx.fillStyle='rgba(255,255,255,.22)';rr(rx-7,Y+26,7,Hd-52,4);ctx.fill();ctx.fillStyle='rgba(0,0,0,.12)';rr(rx,Y+26,5,Hd-52,3);ctx.fill()}
    // corner guards
    ctx.fillStyle='#2b1d14';for(const [gx,gy] of [[X,Y],[X+Wd,Y],[X,Y+Hd],[X+Wd,Y+Hd]]){ctx.beginPath();ctx.arc(gx+(gx>X?-14:14),gy+(gy>Y?-14:14),12,0,7);ctx.fill()}
    // travel stickers
    ctx.save();ctx.translate(X+70,Y+68);ctx.rotate(-.2);ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#2b1d14';ctx.font=FONT(12);ctx.textAlign='center';ctx.fillText('PG AIR',0,4);ctx.restore();
    ctx.save();ctx.translate(X+Wd-80,Y+Hd-74);ctx.rotate(.15);rr(-40,-22,80,44,8);ctx.fillStyle='#4ECDC4';ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=FONT(14);ctx.textAlign='center';ctx.fillText('WORLD',0,-2);ctx.fillText('TOUR',0,14);ctx.restore();
    // zipper
    ctx.setLineDash([7,5]);ctx.strokeStyle='#8a3410';ctx.lineWidth=3;rr(X+10,Y+10,Wd-20,Hd-20,18);ctx.stroke();ctx.setLineDash([]);
    if(zip>0){
      const zx=X+10,zy=Y+10,zw=Wd-20,zh=Hd-20,u=ease(clamp(zip,0,1)),N=Math.max(2,Math.floor(u*120));
      ctx.strokeStyle='#2b1d14';ctx.lineWidth=6;ctx.beginPath();
      for(let i=0;i<=N;i++){const [px,py]=perimPoint(i/120,zx,zy,zw,zh);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
      ctx.strokeStyle='#C9D1DA';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
      const [hx,hy]=perimPoint(u,zx,zy,zw,zh);ctx.fillStyle='#C9D1DA';ctx.strokeStyle='#2b1d14';ctx.lineWidth=3;
      rr(hx-8,hy-4,16,24,5);ctx.fill();ctx.stroke();
    }
  }
  ctx.restore();
  // luggage tag swinging from the handle
  if(tag>0&&sy>0){
    const b=easeOutBack(clamp(tag,0,1)),sw=Math.sin(t*4)*.08*(1-clamp(tag-1,0,1));
    ctx.save();ctx.translate(cx+46,Y-20);ctx.rotate(.35+sw);ctx.scale(b,b);
    ctx.strokeStyle='#2b1d14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,26);ctx.stroke();
    rr(-58,26,116,70,10);ctx.fillStyle='#FFF5E6';ctx.fill();ctx.stroke();
    ctx.fillStyle='#e63946';ctx.fillRect(-58,26,116,16);ctx.fillStyle='#fff';ctx.font=FONT(11);ctx.textAlign='center';ctx.fillText('DESTINATION',0,38);
    ctx.fillStyle='#2b1d14';ctx.font=FONT(17);ctx.fillText(L.place,0,66,104);ctx.font=FONT(11);ctx.fillText('TRIP '+L.order+' · PRIORITY',0,84);
    ctx.restore();
  }
}
function drawBoardingPass(k){
  const s=easeOutBack(clamp(k*3,0,1)),a=Math.min(1,k*5)*Math.min(1,(1.7-k)*5);
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.fillStyle='rgba(31,58,104,.45)';ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,450);ctx.rotate(-.03);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.25)';rr(-206,-92,420,196,22);ctx.fill();
  ctx.fillStyle='#FFF5E6';rr(-210,-100,420,196,22);ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=4;ctx.stroke();
  ctx.save();rr(-210,-100,420,196,22);ctx.clip();ctx.fillStyle=LINING;ctx.fillRect(-210,-100,420,44);ctx.restore();
  ctx.fillStyle='#fff';ctx.font=FONT(18);ctx.textAlign='left';ctx.fillText('BOARDING PASS',-188,-70);
  ctx.textAlign='right';ctx.fillStyle='#FFD23F';ctx.fillText('PG-00'+L.order,188,-70);
  ctx.setLineDash([6,6]);ctx.strokeStyle='#9aa3ad';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(100,-50);ctx.lineTo(100,92);ctx.stroke();ctx.setLineDash([]);
  ctx.textAlign='left';ctx.fillStyle='#7a8796';ctx.font=FONT(14);ctx.fillText('TO',-188,-24);
  ctx.fillStyle='#1F3A68';ctx.font=FONT(36);ctx.fillText(L.place,-188,14,280);
  ctx.fillStyle='#7a8796';ctx.font=FONT(14);ctx.fillText('ITEMS',-188,50);ctx.fillText(TIMER_ON&&L.timer?'BOARDS IN':'BOARDING',-70,50);
  ctx.fillStyle='#2b1d14';ctx.font=FONT(22);ctx.fillText(String(L.pieces.length),-188,78);ctx.fillText(TIMER_ON&&L.timer?L.timer+'s':'Anytime',-70,78);
  ctx.textAlign='center';ctx.fillStyle='#7a8796';ctx.font=FONT(13);ctx.fillText('GATE',155,-24);ctx.fillStyle='#2b1d14';ctx.font=FONT(30);ctx.fillText(String(L.order),155,10);
  for(let i=0;i<16;i++){ctx.fillStyle='#2b1d14';ctx.fillRect(122+i*4,34,(i*7)%3+1,46)}
  ctx.restore();
}

/* ---------- main loop ---------- */
let last=now();
function frame(){
  const t=now(),dt=Math.min(.05,t-last);last=t;

  // state machine
  if(state==='intro'&&t-stateT>1.7){state='play';lastInput=t}
  if(state==='play'&&L.timer&&TIMER_ON){
    timeLeft-=dt;
    if(timeLeft<=10&&timeLeft+dt>10)say('Last call for boarding!',2.2,2);
    if(timeLeft<=0){timeLeft=0;lose()}
  }
  let lid=0,ribbon=0,label=0,slide=0,fly=0;
  if(state==='packed'){
    const k=t-packT;
    lid=clamp((k-.7)/.45,0,1);ribbon=clamp((k-1.35)/.6,0,1);label=clamp((k-2.05)/.3,0,1);slide=clamp((k-2.7)/.6,0,1);fly=clamp((k-2.9)/1.2,0,1);
    if(k>1.15&&!SFX._th){SFX._th=1;SFX.thunk()}
    if(k>1.35&&!SFX._rb){SFX._rb=1;SFX.zip()}
    if(k>2.9&&!SFX._jt){SFX._jt=1;SFX.jet()}
    if(k>4.2){SFX._th=SFX._rb=SFX._jt=0;if(lvl+1<LEVELS.length)startLevel(lvl+1);else showEnd()}
  }
  if(state!=='end'&&t-adStart>60)showEnd();

  for(const p of pieces){
    const tg=target(p),k=Math.min(1,dt*(drag&&drag.p===p?22:13));
    p.disp.x=lerp(p.disp.x,tg.x,k);p.disp.y=lerp(p.disp.y,tg.y,k);p.disp.s=lerp(p.disp.s,tg.s,k);
    if(p.spin)p.spin=Math.abs(p.spin)<.01?0:p.spin*Math.pow(.0005,dt);
    if(p.shake>0)p.shake-=dt;
  }

  // ---- render ----
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#5EC4FF');g.addColorStop(.7,'#D8F1FF');g.addColorStop(.71,'#3A3F48');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
  drawSky(t);

  // header
  ctx.textAlign='center';ctx.fillStyle='#1F3A68';ctx.font=FONT(18);ctx.fillText('TRIP '+L.order+' · FLYING TO',W/2,48);
  ctx.font=FONT(34);ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(L.place,W/2,86);ctx.fillText(L.place,W/2,86);
  // stars pill (top-left)
  rr(14,14,84,36,18);ctx.fillStyle='rgba(31,58,104,.9)';ctx.fill();ctx.fillStyle='#FFD700';ctx.font=FONT(22);ctx.textAlign='left';ctx.fillText('★',26,41);
  ctx.fillStyle='#fff';ctx.fillText(String(stars),56,41);ctx.textAlign='center';
  // timer
  if(L.timer&&TIMER_ON){
    const urgent=timeLeft<=10&&state==='play',s=urgent?1+Math.sin(t*12)*.06:1;
    ctx.save();ctx.translate(W/2+20,122);ctx.scale(s,s);rr(-100,-20,200,40,20);ctx.fillStyle=urgent?'#e63946':'rgba(31,58,104,.92)';ctx.fill();
    const sec=Math.ceil(timeLeft);ctx.fillStyle='#FFD23F';ctx.font=FONT(15);ctx.textAlign='left';ctx.fillText('BOARDING',-84,6);
    ctx.fillStyle='#fff';ctx.font=FONT(24);ctx.textAlign='right';ctx.fillText('0:'+String(sec).padStart(2,'0'),84,9);ctx.textAlign='center';ctx.restore();
  }

  // luggage belt / tray
  drawBelt(t);

  drawMascot(t);

  ctx.save();
  if(slide>0){const s=ease(slide);ctx.translate(s*W*1.15,0);ctx.rotate(Math.sin(t*30)*.01*s)}
  drawBox(t);
  // pieces in the box
  for(const p of pieces)if(p.placed)drawPiece(p,p.disp.x,p.disp.y,p.disp.s,1,t);
  drawLid(lid,ribbon,label,t);
  ctx.restore();
  if(fly>0){const f=ease(fly);drawPlane(lerp(-140,W+160,f),lerp(560,90,f),-.32,1.15,Math.min(220,f*600))}
  if(state==='packed'){
    const k=t-packT;
    ctx.save();ctx.textAlign='center';ctx.lineWidth=9;ctx.strokeStyle='#2b1d14';
    if(k<1.3){const s=easeOutBack(clamp(k/.35,0,1));ctx.translate(W/2,BOX_TOP-40);ctx.scale(s,s);ctx.font=FONT(50);ctx.fillStyle='#FFD700';ctx.strokeText('PERFECT PACK!',0,0);ctx.fillText('PERFECT PACK!',0,0)}
    else if(k<4){ctx.font=FONT(30);ctx.fillStyle='#fff';ctx.globalAlpha=clamp((k-1.3)*4,0,1);const s2=k<2.05?'Zipping up…':'Off to '+L.place+'!';
      ctx.strokeText(s2,W/2,BOX_TOP-44);ctx.fillText(s2,W/2,BOX_TOP-44)}
    ctx.restore();
  }

  // tray pieces
  for(const p of pieces)if(!p.placed&&!(drag&&drag.p===p)&&state!=='packed')drawPiece(p,p.disp.x,p.disp.y,p.disp.s,1,t);

  // drag ghost + dragged piece
  if(drag&&state==='play'){
    const s=snapOf(drag.p);if(s.over)drawGhost(drag.p,s.gx,s.gy,s.ok);
    drawPiece(drag.p,drag.p.disp.x,drag.p.disp.y,drag.p.disp.s,.95,t);
  }

  // intro card for later orders
  if(state==='intro'){
    drawBoardingPass(t-stateT);
  }

  // hook banner (first seconds of the ad)
  const ht=t-adStart;
  if(lvl===0&&!firstTouch&&ht<3&&fails===0){
    const a=Math.min(1,ht*4)*Math.min(1,(3-ht)*3),s=.8+.2*Math.min(1,ht*5);
    ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(W/2,BOX_TOP+L.h*C/2);ctx.rotate(-.05);ctx.scale(s,s);
    rr(-230,-62,460,124,24);ctx.fillStyle='#FFD23F';ctx.fill();ctx.strokeStyle='#2b1d14';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='#2b1d14';ctx.textAlign='center';ctx.font=FONT(34);ctx.fillText('Can you fit it',0,-10);ctx.font=FONT(38);ctx.fillText('ALL in the suitcase?',0,36,430);ctx.restore();
  }

  // hints: always-on in Order 1 (tutorial), after 5s idle in later orders
  if(state==='play'&&!drag&&!down){
    const idle=t-lastInput,tut=lvl===0;
    const show=tut?(firstTouch||ht>2.6)&&idle>.7:idle>5;
    if(show){
      const h=currentHint();
      if(h){
        if(!tut&&hintLogged!==ver){hintLogged=ver;track('hint_shown',{order:L.order,type:h.type})}
        const p=h.p,b=bboxOf(cellsOf(p)),src={x:p.disp.x+b.w*p.disp.s/2,y:p.disp.y+b.h*p.disp.s/2};
        let msg='';
        if(h.type==='rotate'){
          const c=(idle%.9)/.9;drawHand(src.x+6,src.y+6,c<.3,1);msg='Tap to rotate!';
        }else{
          const tx=boxX+(h.x+b.w/2)*C,ty=BOX_TOP+(h.y+b.h/2)*C;
          let dx,dy;
          if(h.type==='remove'){dx=W/2;dy=800;msg='Not quite… drag one out!'}else{dx=tx;dy=ty+LIFT;msg=tut?'Drag it into the suitcase!':'Try here!'}
          const c=(idle%2.3)/2.3;
          if(h.type==='drag')drawGhost(p,h.x,h.y,true,.45+.25*Math.sin(t*6));
          let hx=src.x,hy=src.y,pr=false,carry=0;
          if(c<.15){}else if(c<.25){pr=true}
          else if(c<.75){const q=ease((c-.25)/.5);hx=lerp(src.x,dx,q);hy=lerp(src.y,dy,q);pr=true;carry=q}
          else if(c<.9){hx=dx;hy=dy;pr=true;carry=1}else{hx=dx;hy=dy}
          if(pr&&h.type==='drag'){const s=lerp(p.disp.s,C,carry);drawPiece(p,hx-b.w*s/2,hy-(h.type==='drag'?LIFT*carry:0)-b.h*s/2,s,.55,t)}
          drawHand(hx+6,hy+6,pr,c>.92?(1-c)*12:1);
        }
        if(msg){ctx.save();ctx.textAlign='center';ctx.font=FONT(28);ctx.lineWidth=8;ctx.strokeStyle='#2b1d14';ctx.fillStyle='#fff';
          ctx.strokeText(msg,W/2,656);ctx.fillText(msg,W/2,656);ctx.restore()}
      }
    }
  }

  // fx
  fx=fx.filter(f=>(f.life-=dt)>0);
  for(const f of fx){f.vy+=f.g*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;ctx.save();ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;
    if(f.star){ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}else{ctx.translate(f.x,f.y);ctx.rotate(f.rot+=dt*8);ctx.fillRect(-f.r,-f.r/2,f.r*2,f.r)}ctx.restore()}
  texts=texts.filter(s=>(s.life-=dt)>0);
  for(const s of texts){ctx.save();ctx.globalAlpha=Math.min(1,s.life*2);ctx.textAlign='center';ctx.font=FONT(26);ctx.lineWidth=6;ctx.strokeStyle='#2b1d14';
    const y=s.y-(1-s.life)*50;ctx.strokeText(s.s,s.x,y);ctx.fillStyle=s.c;ctx.fillText(s.s,s.x,y);ctx.restore()}

  requestAnimationFrame(frame);
}

document.getElementById('retry').onclick=()=>{document.getElementById('fail').classList.remove('show');track('retry');startLevel(lvl)};
document.getElementById('replay').onclick=()=>{document.getElementById('end').classList.remove('show');track('replay');fullReset()};

// test hook for automated QA (harmless in production)
window.__pg={get state(){return state},get lvl(){return lvl},solve:()=>solve()&&solve().map(s=>({id:s.p.id,x:s.x,y:s.y,key:keyOf(s.c)})),
  pieces:()=>pieces.map(p=>({id:p.id,k:p.k,key:keyOf(cellsOf(p)),placed:p.placed,disp:p.disp,b:bboxOf(cellsOf(p))})),geo:()=>({C,boxX,BOX_TOP,LIFT})};

fullReset();track('impression');requestAnimationFrame(frame);
})();
</script>
